name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          JAVA_VERSION_OUT=$(java -version 2>&1)
          JAVA_VER_STR=$(echo "$JAVA_VERSION_OUT" | grep -i "version" | head -n 1 | cut -d'"' -f2)
          if [ -z "$JAVA_VER_STR" ]; then
            echo "Error: Java version cannot be detected."
            exit 1
          fi
          JAVA_VER=$(echo "$JAVA_VER_STR" | cut -d'.' -f1)
          if [ "$JAVA_VER" = "1" ]; then
            JAVA_VER=$(echo "$JAVA_VER_STR" | cut -d'.' -f2)
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java major version is lower than 17."
            exit 1
          fi
          echo "Java version is 17 or newer."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore is missing, generating..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "Error: Expected debug APK does not exist at $APK_PATH"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: $APK_PATH does not have the .apk extension."
            exit 1
          fi
          if [ "$APK_PATH" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Path is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "APK verified successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | sed 's/[^a-zA-Z0-9_.-]/_/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${TEMP_DIR}/${RELEASE_FILENAME}"
          echo "asset_path=${TEMP_DIR}/${RELEASE_FILENAME}" >> $GITHUB_OUTPUT
          echo "asset_name=${RELEASE_FILENAME}" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist."
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Prepared release asset is not a non-empty .apk file."
            exit 1
          fi
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          cat << 'EOF' > release_notes.md
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          
          - **GitHub Actions run number:** ${{ github.run_number }}
          - **GitHub Actions run attempt:** ${{ github.run_attempt }}
          - **Source commit SHA:** ${{ github.sha }}
          
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore.
          EOF
          
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --notes-file release_notes.md \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "### Release Publishing Succeeded! :rocket:" >> $GITHUB_STEP_SUMMARY
            gh release view "$TAG_NAME"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Release tag: $TAG_NAME"
            echo "Release title: Debug APK Build #${{ github.run_number }}"
            echo "Release page URL: $RELEASE_URL"
            echo "Exact APK asset filename: $ASSET_NAME"
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Title:** Debug APK Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page URL:** $RELEASE_URL" >> $GITHUB_STEP_SUMMARY
            echo "- **Exact APK Asset Filename:** $ASSET_NAME" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the release **Assets** section at the URL above." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "### :warning: Release Publishing Failed" >> $GITHUB_STEP_SUMMARY
            echo "Warning: Release publishing failed. However, the APK build was successful."
            echo "The normal Actions artifact named **app-debug-apk** remains available."
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Warning: GitHub Release publishing failed. However, the APK build and Actions artifact upload succeeded." >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact named **app-debug-apk** is available for download as a backup." >> $GITHUB_STEP_SUMMARY
          fi
